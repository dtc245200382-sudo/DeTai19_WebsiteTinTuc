
# RATE LIMITING
# Gioi han 10 requests/giay cho moi IP
limit_req_zone $binary_remote_addr zone=website_limit:10m rate=10r/s;
# WORDPRESS WEBSITE
server {
    listen 80;
    server_name localhost;
    client_max_body_size 64M;
    # An phien ban Nginx
    server_tokens off;
    # SECURITY HEADERS
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # LOGGING
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
    # HARDENING
    # Tra ve HTTP 429 neu vuot gioi han
    limit_req_status 429;
    # Chan truy cap file va thu muc an
    # Ngoai tru .well-known
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }
    # REVERSE PROXY - WORDPRESS
    location / {
        # Gioi han request theo IP
        limit_req zone=website_limit burst=20 nodelay;

        proxy_pass http://wordpress:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# NGINX METRICS - PROMETHEUS

server {
    listen 8080;
    server_name localhost;

    location = /stub_status {
        stub_status;
        access_log off;

        # Chi cho phep truy cap noi bo
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }
}
